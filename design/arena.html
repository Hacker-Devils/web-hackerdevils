<style>
/* Design tokens: Hacker Devils design system (dark default, light via data-theme) */
:root,[data-theme=dark]{--bg:#0b0a0c;--surface:#141216;--surface-2:#1d1a20;--line:#2e2a33;--line-strong:#5a5361;--ink:#f4f1ec;--ink-muted:#a59fab;--maroon:#8c1d40;--maroon-deep:#5c1029;--devil:#ff5c8a;--gold:#ffc627;--gold-ink:#ffc627;--ink-on-maroon:#ffffff;--ink-on-gold:#17141a;--accepted:#4ade80;--rejected:#f87171;--focus:#ffc627;--shadow-glow:0 0 0 1px #2e2a33, 0 24px 60px -20px #8c1d4088;}[data-theme=light]{--bg:#faf8f5;--surface:#ffffff;--surface-2:#f1ede8;--line:#e0dad2;--line-strong:#8f877f;--ink:#17141a;--ink-muted:#5d5763;--maroon:#8c1d40;--maroon-deep:#5c1029;--devil:#8c1d40;--gold:#ffc627;--gold-ink:#7a5300;--ink-on-maroon:#ffffff;--ink-on-gold:#17141a;--accepted:#15803d;--rejected:#b91c1c;--focus:#8c1d40;--shadow-glow:0 1px 2px #17141a14, 0 16px 40px -18px #17141a33;}:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;--space-24:96px;--radius-sm:4px;--radius-md:10px;--radius-lg:18px;--radius-pill:999px;--font-display:"Geist", "Inter", system-ui, sans-serif;--font-sans:"Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;--font-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;--font-serif:"Instrument Serif", Georgia, serif;}html,body{margin:0}body{background:#0b0a0c}
#r{background:var(--bg);color:var(--ink);font-family:var(--font-sans);min-height:100vh}
#r *{box-sizing:border-box}
:where(#r) a{color:inherit;text-decoration:none}
#r [hidden]{display:none!important}
h1,h2{font-weight:200} h3{font-weight:400}
.wrap{max-width:1216px;margin:0 auto;padding:0 32px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.ruler{height:14px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--line-strong) 0 1px,transparent 1px 16px) bottom/100% 6px no-repeat,repeating-linear-gradient(90deg,var(--line-strong) 0 1px,transparent 1px 80px) bottom/100% 14px no-repeat}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px;gap:24px}
.logo{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:500;letter-spacing:-.01em}
.mark{width:36px;height:36px;display:grid;place-items:center;background:var(--gold);color:var(--ink-on-gold);font:500 12px var(--font-mono);clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%)}
.links{display:flex;gap:2px;font:400 13px var(--font-mono);text-transform:uppercase;letter-spacing:.06em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;font:500 14px var(--font-sans);border:1px solid transparent;cursor:pointer;border-radius:0;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--bg)}
.gold{background:var(--gold);color:var(--ink-on-gold)}
.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.ic{width:46px;padding:0}

.hero{display:grid;grid-template-columns:1fr 360px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

.lead{font-size:19px;line-height:1.55;color:var(--ink-muted);max-width:56ch;margin:36px 0 32px}
.hr{display:flex;flex-direction:column}
.clock{background:var(--gold);color:var(--ink-on-gold);padding:32px;flex:1;position:relative;overflow:hidden}
.clock:after{content:"";position:absolute;right:-30px;bottom:-30px;width:200px;height:200px;background:repeating-linear-gradient(135deg,rgba(23,20,26,.14) 0 10px,transparent 10px 22px)}
.clock .t{font-size:15px;font-weight:500}
.digits{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 16px;margin-top:28px;position:relative}
.digits b{display:block;font:300 64px/1 var(--font-mono);letter-spacing:-.04em}
.digits span{font-size:13px;opacity:.75}
.meta{padding:22px 32px;border-top:1px solid var(--line)}
.meta b{display:block;font-weight:300;font-size:24px;letter-spacing:-.01em}
.meta span{color:var(--ink-muted);font-size:14px}
.ph{padding:96px 0 56px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end;gap:40px}
.pt{font-size:128px;line-height:.85;letter-spacing:-.06em;text-transform:uppercase;margin:0}
.ph p{max-width:36ch;color:var(--ink-muted);font-size:18px;line-height:1.55;margin:0}
section{padding:96px 0;border-bottom:1px solid var(--line)}
section.last{border-bottom:0}
.sh{display:flex;justify-content:space-between;align-items:end;margin-bottom:44px;gap:32px}
h2{font-size:64px;line-height:.95;letter-spacing:-.045em;margin:0;text-transform:uppercase}
.sh p{margin:0;color:var(--ink-muted);max-width:44ch;line-height:1.6}
.more{margin-top:20px;text-align:right;font:400 13px var(--font-mono);text-transform:uppercase;letter-spacing:.06em}
.more a:hover{color:var(--devil)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:64px;margin-bottom:64px}
.about p{font-size:18px;line-height:1.7;color:var(--ink-muted);margin:0 0 18px}
.about p.big{font-size:28px;line-height:1.35;color:var(--ink);font-weight:300;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-strong)}
.stat{padding:28px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font:200 72px/1 var(--font-sans);letter-spacing:-.05em}
.stat:first-child b{color:var(--gold-ink)}
.stat span{display:block;margin-top:12px;color:var(--ink-muted);font-size:14px}
.prog{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line-strong);border-left:1px solid var(--line-strong)}
.pc{border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);padding:36px 32px;min-height:300px;display:flex;flex-direction:column;transition:background .15s}
.pc:hover{background:var(--surface)}
.pc .n{font:400 13px var(--font-mono);color:var(--ink-muted)}
.pc h3{font-size:30px;font-weight:300;letter-spacing:-.02em;margin:40px 0 12px;text-transform:uppercase;line-height:1}
.pc p{color:var(--ink-muted);line-height:1.6;margin:0 0 20px;font-size:15px}
.when{margin-top:auto;font-size:14px;display:flex;align-items:center;gap:10px}
.when:before{content:"";width:18px;height:1px;background:var(--devil)}
.pc.feat{background:var(--maroon);color:var(--ink-on-maroon)}
.pc.feat p,.pc.feat .n{color:var(--ink-on-maroon);opacity:.85}
.pc.feat .when:before{background:var(--gold)}
.soon{font:400 11px var(--font-mono);background:var(--gold);color:var(--ink-on-gold);padding:3px 7px;margin-left:8px;vertical-align:6px;letter-spacing:.04em}
.wed{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-strong)}
.ws{padding:32px;border-right:1px solid var(--line)}
.ws:last-child{border-right:0}
.ws b{font:300 15px var(--font-mono);color:var(--gold-ink)}
.ws h3{font-size:24px;font-weight:300;margin:16px 0 8px}
.ws p{margin:0;color:var(--ink-muted);line-height:1.6;font-size:15px}
.tl{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.tl>div{padding:28px 28px 0 0;margin-right:28px;border-right:1px solid var(--line)}
.tl>div:last-child{border-right:0}
.tl .y{font:400 13px var(--font-mono);color:var(--devil);text-transform:uppercase;letter-spacing:.06em}
.tl h3{font-size:30px;font-weight:300;margin:14px 0 10px;letter-spacing:-.02em}
.tl p{margin:0;color:var(--ink-muted);line-height:1.6;font-size:15px}
.tabs{display:flex;border:1px solid var(--line-strong);width:max-content;margin-bottom:24px}
.tab{all:unset;padding:12px 22px;font:400 13px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;color:var(--ink-muted)}
.tab.on{background:var(--ink);color:var(--bg)}
.ev{border:1px solid var(--line-strong)}
.er{display:grid;grid-template-columns:150px 1fr 280px 140px;align-items:center;padding:22px 28px;border-bottom:1px solid var(--line)}
.er:last-child{border-bottom:0}
.er:hover{background:var(--surface)}
.er .d{font:300 22px var(--font-mono);letter-spacing:-.02em}
.er .t{font-size:18px}
.er .w{color:var(--ink-muted);font-size:14px}
.er .a{text-align:right}
.tag{display:inline-block;font:400 11px var(--font-mono);padding:5px 9px;border:1px solid var(--line-strong);color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin-left:4px;cursor:pointer}
.tag.g{background:var(--gold);border-color:var(--gold);color:var(--ink-on-gold)}
.vs{display:grid;grid-template-columns:1fr 1fr;position:relative;border:1px solid var(--line-strong)}
.side{padding:52px 48px;display:flex;flex-direction:column}
.side.ai{background:var(--maroon);color:var(--ink-on-maroon);padding-right:84px}
.side.peer{padding-left:84px}
.side h3{font-size:52px;font-weight:200;letter-spacing:-.04em;margin:0 0 16px;text-transform:uppercase;line-height:.95}
.side p{line-height:1.6;max-width:42ch;margin:0 0 24px;opacity:.88}
.side ul{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:10px;font-size:15px}
.side ul li{display:flex;gap:10px} .side ul li:before{content:"";width:14px;height:1px;background:currentColor;margin-top:11px;opacity:.6}
.side.peer ul li:before{background:var(--devil);opacity:1}
.side.ai .btn{background:var(--ink-on-maroon);color:var(--maroon)}
.vsb{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;background:var(--gold);color:var(--ink-on-gold);display:grid;place-items:center;font:500 22px var(--font-mono);border-radius:50%;box-shadow:0 0 0 8px var(--bg)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));border:1px solid var(--line-strong)}
.sg{all:unset;box-sizing:border-box;padding:18px 20px;cursor:pointer;border-right:1px solid var(--line-strong);transition:background .15s}
.sg:last-child{border-right:0}
.sg:hover{background:var(--surface)}
.sg i{font:400 12px var(--font-mono);font-style:normal;color:var(--ink-muted)}
.sg b{display:block;font-weight:400;font-size:16px;margin-top:6px}
.sg.on{background:var(--ink);color:var(--bg)} .sg.on i{color:var(--bg);opacity:.7}
.sn{font:400 10px var(--font-mono);color:var(--gold-ink);margin-left:6px;text-transform:uppercase}
.sg.on .sn{color:var(--gold)}
.panel{display:grid;grid-template-columns:1.3fr 1fr;border:1px solid var(--line-strong);border-top:0}
.pl{padding:44px;border-right:1px solid var(--line)}
.pl .when{margin:0 0 20px}
.pl h3{font-size:48px;font-weight:200;letter-spacing:-.04em;margin:0 0 16px;text-transform:uppercase;line-height:.95}
.pl p{color:var(--ink-muted);line-height:1.7;margin:0 0 28px;font-size:17px}
.pr{padding:44px;background:var(--surface)}
.pr h4{margin:0 0 20px;font:400 12px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted)}
.pr ol{margin:0;padding:0;list-style:none;counter-reset:l}
.pr li{counter-increment:l;display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--line);font-size:17px}
.pr li:before{content:counter(l,decimal-leading-zero);font:400 13px var(--font-mono);color:var(--gold-ink);padding-top:3px}
.blurb{font-size:22px;font-weight:300;margin:32px 0 24px;letter-spacing:-.01em}
.board{border:1px solid var(--line-strong)}
.br{display:grid;grid-template-columns:80px 1fr 260px;align-items:center;padding:22px 28px;border-bottom:1px solid var(--line);transition:background .15s}
.br:last-child{border-bottom:0}
.br:hover{background:var(--surface)}
.br .rk{font:300 32px var(--font-mono);color:var(--ink-muted)}
.br:first-child .rk{color:var(--gold-ink)}
.br .tt{display:block;font-size:19px}
.br .ds{display:block;font-size:14px;color:var(--ink-muted);margin-top:4px}
.br .mm{text-align:right}
.empty{border:1px solid var(--line-strong);padding:72px 48px;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.empty b{font-weight:200;font-size:56px;letter-spacing:-.04em;text-transform:uppercase}
.empty p{margin:0 0 8px;color:var(--ink-muted);max-width:52ch;line-height:1.6}
.team{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line-strong);border-left:1px solid var(--line-strong)}
.tm{border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);padding:24px;display:flex;gap:16px;align-items:center}
.av{width:52px;height:52px;flex:none;display:grid;place-items:center;font:400 15px var(--font-mono);background:var(--surface-2);border:1px solid var(--line-strong)}
.av.officer{background:var(--maroon);color:var(--ink-on-maroon);border-color:var(--maroon)}
.av.advisor{background:var(--gold);color:var(--ink-on-gold);border-color:var(--gold)}
.tm b{display:block;font-weight:400;font-size:17px}
.tm span{font-size:13px;color:var(--ink-muted)}
.partners{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-strong)}
.ptn{padding:32px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ptn:last-child{border-right:0}
.ptn b{font-weight:300;font-size:26px;letter-spacing:-.02em}
.ptn span{font-size:14px;color:var(--ink-muted)}
.faq{border-top:1px solid var(--line-strong)}
.q{border-bottom:1px solid var(--line-strong)}
.q button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;padding:26px 0;cursor:pointer;font-size:22px;font-weight:300;letter-spacing:-.01em}
.q button i{font:300 26px var(--font-mono);font-style:normal;color:var(--gold-ink);transition:transform .2s}
.q.open button i{transform:rotate(45deg)}
.q .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s}
.q.open .a{grid-template-rows:1fr}
.q .a>div{overflow:hidden}
.q .a p{margin:0 0 26px;color:var(--ink-muted);line-height:1.7;max-width:70ch;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.h3{font-size:32px;font-weight:300;letter-spacing:-.02em;margin:0 0 20px}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-strong)}
.steps li{display:flex;gap:20px;padding:20px 0;border-bottom:1px solid var(--line);font-size:18px}
.steps b{font:300 15px var(--font-mono);color:var(--gold-ink);padding-top:3px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:20px;border:1px solid var(--line-strong);padding:40px}
.form label{display:flex;flex-direction:column;gap:8px;font:400 12px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{font:400 16px var(--font-sans);text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line-strong);padding:13px 14px;border-radius:0}
.form .btn{grid-column:1/-1;justify-self:start}
.sent{grid-column:1/-1;font-size:24px;font-weight:300;padding:20px 0}
.host{display:flex;justify-content:space-between;align-items:center;gap:40px;border:1px solid var(--line-strong);padding:48px;background:var(--surface)}
.host p{color:var(--ink-muted);margin:14px 0 0;max-width:52ch;line-height:1.6}
.jsteps{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-strong)}
.js{padding:40px;border-right:1px solid var(--line);min-height:260px;display:flex;flex-direction:column;transition:background .15s}
.js:last-child{border-right:0}
a.js:hover{background:var(--surface)}
.js b{font:300 40px var(--font-mono);color:var(--gold-ink)}
.js h3{font-size:30px;font-weight:300;letter-spacing:-.02em;margin:auto 0 10px}
.js p{margin:0;color:var(--ink-muted);line-height:1.6}
.js.gold{background:var(--gold);color:var(--ink-on-gold)} .js.gold b{color:var(--ink-on-gold)} .js.gold p{color:var(--ink-on-gold);opacity:.8}
.cta{background:var(--gold);color:var(--ink-on-gold);padding:80px 0}
.cta .wrap{display:flex;justify-content:space-between;align-items:center;gap:32px}
.cta h2{font-size:96px}
.cta p{margin:16px 0 0;font-size:17px;opacity:.8}
.cta .btn{background:var(--ink-on-gold);color:var(--gold)}
.cta .btn.o{background:transparent;border-color:var(--ink-on-gold);color:var(--ink-on-gold)}
footer{padding:56px 0 32px;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;padding-bottom:40px;border-bottom:1px solid var(--line)}
.fg h4{margin:0 0 14px;font:400 12px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted)}
.fg div>a:not(.logo){display:block;font-size:15px;margin-bottom:10px}
.fg a:hover{color:var(--devil)}
.fg p{color:var(--ink-muted);line-height:1.6;margin:14px 0 0;max-width:36ch;font-size:15px}
.copy{display:flex;justify-content:space-between;padding-top:24px;font-size:13px;color:var(--ink-muted)}
@media (max-width:900px){
  .wrap{padding:0 16px}
  .links{display:none}
  .hero,.about,.two,.panel{grid-template-columns:1fr}
  .hl{border-right:0;padding:48px 0}
  .hero h1{font-size:72px}
  .pt{font-size:64px}
  .ph{flex-direction:column;align-items:flex-start;padding:56px 0 32px}
  h2{font-size:40px}
  .stats,.wed,.tl{grid-template-columns:1fr 1fr}
  .team,.prog,.partners,.jsteps{grid-template-columns:1fr}
  .pl,.pr,.js,.ws,.stat{padding:28px 20px;min-width:0}
  .tl>div{margin-right:16px;padding-right:16px}
  .stat b{font-size:52px}
  .digits b{font-size:48px}
  .vs{grid-template-columns:1fr} .vsb{display:none} .side.ai,.side.peer{padding:36px 24px}
  .er,.br{grid-template-columns:1fr;gap:6px}.er .a,.br .mm{text-align:left}
  .seg{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr;padding:24px}
  .cta .wrap,.host,.sh{flex-direction:column;align-items:flex-start}
  .cta h2{font-size:56px}
  .fg{grid-template-columns:1fr 1fr}
  section{padding:64px 0}
}
@media (prefers-reduced-motion:reduce){#r *{transition:none!important}}

  function initials(n) { return n.split(' ').map(function (w) { return w[0]; }).slice(0, 2).join(''); }

  function mount(skin) {
    var r = document.getElementById('r');
    var stored = null;
    try { stored = localStorage.getItem('hkd-theme'); } catch (e) {}
    var prefersLight = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches;
    function setTheme(t) {
      r.dataset.theme = t;
      document.documentElement.style.background = 'var(--bg)';
      var b = document.getElementById('tt'); if (b) b.innerHTML = t === 'dark' ? SUN : MOON;
      try { localStorage.setItem('hkd-theme', t); } catch (e) {}
    }
    function route() { var h = location.hash.replace(/^#\/?/, ''); return D.nav.some(function (n) { return n[0] === h; }) ? h : 'home'; }
    function render() {
      var k = route();
      r.innerHTML = skin.header(k) + '<main id="main">' + skin.pages[k]() + '</main>' + skin.footer();
      setTheme(r.dataset.theme || stored || (prefersLight ? 'light' : 'dark'));
      window.scrollTo(0, 0);
      tick();
    }
    r.addEventListener('click', function (e) {
      if (e.target.closest('#tt')) { setTheme(r.dataset.theme === 'dark' ? 'light' : 'dark'); return; }
      var tab = e.target.closest('[data-tab]');
      if (tab) {
        var g = tab.dataset.group;
        r.querySelectorAll('[data-tab][data-group="' + g + '"]').forEach(function (t) { t.classList.toggle('on', t === tab); });
        r.querySelectorAll('[data-panel][data-group="' + g + '"]').forEach(function (p) { p.hidden = p.dataset.panel !== tab.dataset.tab; });
        return;
      }
      var q = e.target.closest('.q > button'); if (q) { q.parentNode.classList.toggle('open'); return; }
    });
    r.addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target; f.innerHTML = '<div class="sent">Thanks! We\'ll be in touch on Discord or by email.</div>';
    });
    window.addEventListener('hashchange', render);
    function next() { var n = new Date(), t = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), 1, 0, 0)); while (t.getUTCDay() !== 4 || t <= n) t = new Date(t.getTime() + 864e5); return t; }
    var W = next(), p2 = function (x) { return String(x).padStart(2, '0'); };

      var ms = W - new Date(); if (ms <= 0) { W = next(); ms = W - new Date(); }
      var s = Math.floor(ms / 1e3), v = { d: Math.floor(s / 86400), h: p2(Math.floor(s % 86400 / 3600)), m: p2(Math.floor(s % 3600 / 60)), s: p2(s % 60) };
      r.querySelectorAll('[data-cd]').forEach(function (el) { el.textContent = v[el.dataset.cd]; });
    }
    setInterval(tick, 1000);
    render();
  }
  window.HKD = { D: D, mount: mount, initials: initials };
})();
